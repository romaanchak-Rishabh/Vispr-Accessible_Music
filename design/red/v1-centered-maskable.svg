<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Full-bleed maskable variant of v1-centered-night (no rounded corners, no transparency) -->
  <defs>
    <linearGradient id="bgm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1420"/>
      <stop offset="1" stop-color="#12080b"/>
    </linearGradient>
    <radialGradient id="discm" cx="0.38" cy="0.32" r="0.9">
      <stop offset="0" stop-color="#33222b"/>
      <stop offset="0.6" stop-color="#191218"/>
      <stop offset="1" stop-color="#0c090c"/>
    </radialGradient>
    <linearGradient id="labelm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb5c74"/>
      <stop offset="1" stop-color="#fa233b"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bgm)"/>

  <!-- record scaled into the 80% safe zone -->
  <g transform="translate(256 256) scale(0.78) translate(-256 -256)">
    <circle cx="256" cy="256" r="176" fill="url(#discm)"/>
    <g stroke="#ff8ba0" fill="none">
      <circle cx="256" cy="256" r="152" stroke-width="2.5" opacity="0.13"/>
      <circle cx="256" cy="256" r="132" stroke-width="2.5" opacity="0.11"/>
      <circle cx="256" cy="256" r="112" stroke-width="2.5" opacity="0.09"/>
      <circle cx="256" cy="256" r="92" stroke-width="2.5" opacity="0.07"/>
    </g>
    <circle cx="256" cy="256" r="56" fill="url(#labelm)"/>
    <circle cx="256" cy="256" r="7" fill="#12080b"/>
    <path d="M118 256 q34 -34 69 0 t69 0 t69 0 t69 0"
          stroke="#ffe1e7" stroke-width="15" stroke-linecap="round" fill="none" opacity="0.95"/>
  </g>
</svg>
